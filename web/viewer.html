<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIBO — parts viewer</title>
<link rel="icon" href="./mark.svg?v=be990a3c" type="image/svg+xml">
<link rel="stylesheet" href="./site.css?v=b5bc8990">
<style>
/* Fixed row height, not min-height. With min-height the grid row stretched
   to the parts list's natural height -- 66 rows -- and the canvas came out
   582 x 2196, which is what made the model look wildly over-zoomed. Both
   columns now fill one viewport and scroll internally. */
.vwrap{display:grid;grid-template-columns:330px 1fr;gap:20px;
  padding:88px 24px 24px;max-width:1500px;margin:0 auto;
  height:100vh}
.panel{border:var(--edge);border-radius:20px;background:var(--white);
  box-shadow:6px 6px 0 var(--ink);overflow:hidden;display:flex;
  flex-direction:column;min-height:0}
.panel .hd{padding:14px 16px;border-bottom:2px solid var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel .hd h2{font-size:22px;margin:0}
.list{overflow:auto;padding:6px 0;flex:1}
.grp{padding:14px 16px 5px;font-family:var(--disp);font-size:12px;
  letter-spacing:.1em;color:var(--blue)}
.row{display:flex;align-items:center;gap:9px;padding:6px 16px;cursor:pointer;
  transition:background 120ms var(--ease-out)}
.row:hover{background:#f2f0ff}
.ck{width:14px;height:14px;border-radius:4px;flex:none;border:1.5px solid var(--ink);
  display:grid;place-items:center;font-size:9px;font-weight:700;line-height:1;
  background:var(--ink);color:var(--white);
  transition:background 130ms var(--ease-out), color 130ms var(--ease-out)}
.ck::after{content:"\2713"}
.row.off .ck{background:none;color:transparent;border-color:#c9c7d2}
.row.off .nm{opacity:.45}
.sw{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.25)}
.nm{flex:1;font-size:13.5px;font-variant-numeric:tabular-nums}
.dl{border:1.5px solid var(--ink);border-radius:999px;background:var(--white);
  font-family:var(--disp);font-size:11px;padding:2px 9px;text-decoration:none;
  opacity:0;transform:translateX(4px);
  transition:opacity 140ms var(--ease-out), transform 140ms var(--ease-out),
             background 140ms var(--ease-out)}
.row:hover .dl, .dl:focus-visible{opacity:1;transform:none}
.dl:hover{background:var(--pink)}
.stagewrap{position:relative;border:var(--edge);border-radius:20px;overflow:hidden;
  box-shadow:6px 6px 0 var(--ink);
  background:radial-gradient(120% 90% at 50% 0%,#fff 0%,var(--paper) 62%,#dcdbe0 100%)}
#vc{display:block;width:100%;height:100%;cursor:grab}
#vc:active{cursor:grabbing}
.overlay{position:absolute;left:14px;top:14px;display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden;
  background:var(--white);box-shadow:3px 3px 0 var(--ink)}
.seg button{border:0;background:none;font-family:var(--disp);font-size:13px;
  padding:7px 14px;cursor:pointer;color:var(--ink);
  transition:background 140ms var(--ease-out), color 140ms var(--ease-out)}
.seg button.on{background:var(--blue);color:#fff}
.hint{position:absolute;left:14px;bottom:12px;font-size:11.5px;color:#555}
.vload{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--disp);font-size:18px;background:var(--paper);z-index:3}
@media(max-width:920px){.vwrap{grid-template-columns:1fr;height:auto}
  .panel{max-height:52vh}
  .stagewrap{height:64vh}}
</style>
</head>
<body>

<nav>
  <a class="logo" href="./index.html" aria-label="AIBO home">
    <svg viewBox="0 0 316 92" aria-hidden="true">
      <g fill="currentColor">
        <path d="M4 78 L27 8 h17 l23 70 h-19 l-3.6-12H26.6L23 78 Z M30.4 51 h10.2 L35.5 33 Z"/>
        <path d="M75 8 h18 v70 h-18 Z"/>
        <path d="M103 8 h31 c13.6 0 22 7.6 22 18.4 0 7.4-3.8 12.8-10 15.4 7.8 2.2 12.2 8.2 12.2 16.6 0 11.8-9 19.6-24 19.6 H103 Z M121 35 h10.8 c4.8 0 7.4-2.2 7.4-6 0-3.9-2.6-5.8-7.4-5.8H121 Z M121 62.6 h12 c5.2 0 8-2.2 8-6.4 0-4.1-2.8-6.2-8-6.2H121 Z"/>
      </g>
      <circle cx="238" cy="41" r="32" fill="#4D17F5" stroke="currentColor" stroke-width="7"/>
      <circle cx="238" cy="41" r="12.5" fill="#FA9DCD"/>
      <path d="M262 63 L279 74" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/>
      <rect x="258" y="79" width="46" height="11" rx="5.5" fill="currentColor"/>
    </svg>
  </a>
  <div class="navr">
    <a class="btn" href="./index.html">HOME</a>
    <a class="btn blue" id="zip" href="#">DOWNLOAD ALL STLs</a>
  </div>
</nav>

<div class="vwrap">
  <div class="panel">
    <div class="hd">
      <h2>PARTS</h2>
      <button class="btn sm" id="toggleall">HIDE ALL</button>
    </div>
    <div class="list" id="list"></div>
  </div>

  <div class="stagewrap">
    <div class="vload" id="vload">LOADING THE MODEL…</div>
    <canvas id="vc"></canvas>
    <div class="overlay">
      <div class="seg" id="modes">
        <button data-m="assembled" class="on">ASSEMBLED</button>
        <button data-m="exploded">EXPLODED</button>
      </div>
    </div>
    <div class="hint">drag to orbit · scroll to zoom · hover a part for its STL</div>
  </div>
</div>

<script type="module" src="./viewer.js?v=6b6f388a"></script>
</body>
</html>
