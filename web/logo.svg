<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 452 92" role="img" aria-label="HOTARU">
  <!-- HOTARU. Renamed off AIBO, which is Sony's registered mark for their
       robot dog; shipping a robot desk pet under it would have been asking
       for a letter.

       Hotaru is the Japanese for firefly: a small living light that moves,
       which is the whole product in one word. The O keeps the lit centre from
       the old mark, so the idea survives the rename. -->
  <g fill="currentColor">
    <!-- H -->
    <path d="M4 8 h18 v26 h20 V8 h18 v70 h-18 V51 H22 v27 H4 Z"/>
    <!-- O: the firefly's glow -->
    <path d="M76 43 a35 35 0 1 1 70 0 a35 35 0 1 1 -70 0 Z
             M94 43 a17 17 0 1 0 34 0 a17 17 0 1 0 -34 0 Z" fill-rule="evenodd"/>
    <!-- T -->
    <path d="M152 8 h60 v17 h-21 v53 h-18 V25 h-21 Z"/>
    <!-- A -->
    <path d="M212 78 L235 8 h17 l23 70 h-19 l-3.6-12h-14.8L234 78 Z
             M241.4 51 h10.2 L246.5 33 Z"/>
    <!-- R -->
    <path d="M282 8 h30 c15 0 24 8.6 24 21.6 0 9-4.4 15.8-12 19.2 L338 78 h-20
             l-12-25.6h-6V78h-18 Z
             M300 37.6 h10 c5.4 0 8.4-2.8 8.4-7.6 0-4.8-3-7.4-8.4-7.4h-10 Z"/>
    <!-- U -->
    <path d="M346 8 h18 v43 c0 7.4 4 11.6 11 11.6 7 0 11-4.2 11-11.6V8 h18 v43.6
             c0 17-11.2 27.8-29 27.8 -17.8 0-29-10.8-29-27.8 Z"/>
  </g>
  <circle cx="111" cy="43" r="10.5" fill="#4D17F5"/>
  <circle cx="111" cy="43" r="4.4" fill="#FA9DCD"/>
</svg>
