<style>
/* ---- one hero, full bleed ----
   The canvas is the PAGE, not a panel on it: fixed, behind everything, same
   black as the body. The previous version put it in a bordered box with its
   own background, which drew a visible rectangle around the model. */
html,body{height:100%;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;
  background:var(--bg);cursor:grab;z-index:0}
#c:active{cursor:grabbing}
.skeleton{position:fixed;inset:0;display:grid;place-items:center;
  background:var(--bg);z-index:5;transition:opacity var(--t-ui) var(--ease)}
.skeleton span{width:110px;height:260px;border-radius:16px;
  background:var(--surface-2);animation:pulse 1.6s var(--ease) infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:.85}}

/* title, over the model */
/* Title block gets its own scrim: it sits over the model, and the sub line
   was landing right on the shade where it could not be read. */
.title{position:fixed;left:0;right:0;top:0;z-index:2;text-align:center;
  pointer-events:none;padding:calc(var(--s-800) + var(--s-200)) var(--s-300) var(--s-600);
  background:linear-gradient(to bottom,rgba(0,0,0,.92) 55%,rgba(0,0,0,0))}
.title h1{font-size:44px;line-height:1;letter-spacing:-0.04em;
  background:linear-gradient(90deg,#FFFFFF 0%,#9B9B9B 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
@media(min-width:768px){ .title h1{font-size:72px} }
.title p{margin-top:var(--s-100);font-size:20px;line-height:28px;
  font-weight:600;color:var(--fg)}
@media(min-width:768px){ .title p{font-size:24px;line-height:32px} }
.title .sub{display:block;margin:var(--s-100) auto 0;max-width:460px;
  font-size:14px;line-height:20px;color:var(--fg-mute)}

/* voice toggle, right edge */
.sound{position:fixed;right:var(--s-400);top:50%;transform:translateY(-50%);
  z-index:4;display:flex;flex-direction:column;border-radius:9999px;
  overflow:hidden;border:1px solid var(--line-2);background:rgba(24,24,24,.7);
  backdrop-filter:blur(16px)}
.sound button{width:44px;height:44px;display:grid;place-items:center;border:0;
  background:transparent;color:var(--fg-mute);cursor:pointer;
  transition:background var(--t-ui) var(--ease),color var(--t-ui) var(--ease)}
.sound button:hover{color:var(--fg)}
.sound button[aria-pressed="true"]{background:var(--blue);color:#fff}
.sound button:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}

.restart{position:fixed;left:var(--s-400);bottom:calc(var(--s-400) + 156px);
  z-index:4;width:44px;height:44px;border-radius:9999px;display:grid;
  place-items:center;border:1px solid var(--line-2);color:var(--fg-mute);
  background:rgba(24,24,24,.7);backdrop-filter:blur(16px);cursor:pointer;
  transition:color var(--t-ui) var(--ease),transform var(--t-press) var(--ease)}
.restart:hover{color:var(--fg)}
.restart:active{transform:scale(.94)}
.restart:focus-visible{outline:2px solid var(--blue);outline-offset:3px}

/* the sheet. No panel edge: a scrim that fades up out of the page. */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:4;
  padding:var(--s-800) var(--s-400) var(--s-400);
  background:linear-gradient(to top,rgba(0,0,0,.94) 42%,rgba(0,0,0,0));
  pointer-events:none}
.sheet > *{pointer-events:auto}
.line{font-size:20px;line-height:28px;font-weight:600;min-height:56px;
  max-width:720px;text-wrap:pretty}
@media(min-width:768px){ .line{font-size:24px;line-height:32px} }
.line::after{content:"";display:inline-block;width:9px;height:1em;
  background:var(--fg);vertical-align:-2px;margin-left:4px;opacity:0}
.line.typing::after{opacity:1}
.line.done::after{opacity:1;animation:blink 1.1s steps(2) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

.chips{display:flex;gap:var(--s-75);flex-wrap:wrap;margin-top:var(--s-200);
  min-height:40px}
.chip{font-family:inherit;font-size:14px;line-height:20px;font-weight:600;
  padding:var(--s-75) var(--s-200);border-radius:9999px;cursor:pointer;
  border:1px solid var(--line-2);background:rgba(31,31,31,.86);color:var(--fg);
  backdrop-filter:blur(10px);opacity:0;transform:translateY(8px);
  transition:opacity 400ms var(--ease),transform 400ms var(--ease),
             background var(--t-ui) var(--ease),border-color var(--t-ui) var(--ease)}
.chip.in{opacity:1;transform:none}
.chip:hover{background:var(--line-2);border-color:var(--fg-mute)}
.chip.go{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.go:hover{background:#5B29FF}
.chip:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.chips input{flex:1;min-width:240px;font-family:inherit;font-size:16px;
  line-height:24px;padding:var(--s-75) var(--s-200);border-radius:9999px;
  border:1px solid var(--line-2);background:rgba(31,31,31,.86);color:var(--fg)}
.chips input::placeholder{color:var(--fg-mute)}
.chips input:focus{outline:2px solid var(--blue);outline-offset:2px}
.err{color:#FF9A8A;font-size:14px;line-height:20px;margin-top:var(--s-75);
  min-height:20px}
/* Audio cannot start without a gesture, so say so instead of silently
   waiting. Removes itself the moment the first click, tap or key lands. */
.tap{position:fixed;left:50%;bottom:calc(var(--s-400) + 148px);
  transform:translateX(-50%);z-index:6;display:inline-flex;align-items:center;
  gap:var(--s-75);font-family:inherit;font-size:14px;line-height:20px;
  font-weight:600;color:var(--fg);cursor:pointer;
  padding:var(--s-75) var(--s-200);border-radius:9999px;
  border:1px solid var(--line-2);background:rgba(24,24,24,.86);
  backdrop-filter:blur(16px);
  animation:rise 600ms var(--ease) both 900ms}
@keyframes rise{from{opacity:0;transform:translate(-50%,10px)}
                to{opacity:1;transform:translate(-50%,0)}}
.tap .dot{width:7px;height:7px;border-radius:9999px;background:var(--blue);
  animation:ping 1.6s var(--ease) infinite}
@keyframes ping{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
body.audio-on .tap{display:none}

.hint{position:fixed;right:var(--s-400);bottom:var(--s-300);z-index:3;
  font-size:12px;line-height:16px;color:var(--fg-mute);pointer-events:none}
</style>
</head>
