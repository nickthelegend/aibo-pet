<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Hotaru">
  <!-- Tab icon: a firefly, which at 16px has to be one glow and a hint of
       wings and nothing else. The old mark drew a whole lamp, arm and light
       cone, all of which closed up to mush at favicon size. -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#4D17F5"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none"
        stroke="#151515" stroke-width="4"/>

  <!-- wings, swept back, pale so the glow stays the subject -->
  <path d="M32 27 C22 17 12 20 14 30 C16 39 26 38 32 33 Z" fill="#EEEEEC"
        opacity=".92"/>
  <path d="M32 27 C42 17 52 20 50 30 C48 39 38 38 32 33 Z" fill="#EEEEEC"
        opacity=".72"/>

  <!-- the light: the whole point of the animal and the product -->
  <circle cx="32" cy="42" r="13" fill="#151515"/>
  <circle cx="32" cy="42" r="9.5" fill="#FA9DCD"/>
  <circle cx="32" cy="42" r="4.5" fill="#FFFFFF"/>
</svg>
