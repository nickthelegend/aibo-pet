<body style="background:#000;margin:0;padding:28px;font-family:system-ui">
<div style="color:#fff;display:flex;gap:28px;align-items:center;flex-wrap:wrap">
  <div id="a"></div><div id="b" style="color:#4D17F5"></div>
</div>
<div style="background:#EEEEEC;padding:22px;margin-top:22px;color:#151515" id="c"></div>
<script>
fetch('/web/logo.svg').then(r=>r.text()).then(s=>{
  a.innerHTML=s; b.innerHTML=s; c.innerHTML=s;
  [a,b,c].forEach((el,i)=>{const sv=el.querySelector('svg'); sv.style.height=[64,40,52][i]+'px'; sv.style.width='auto';});
});
</script></body>
